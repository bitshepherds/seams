name: ci

on:
  pull_request:
    # edited, so a retitled pull request has its title checked again.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  # Weekly, so a new advisory against a dependency is caught on a quiet week.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, so the gate's secret scan sees every commit.
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: The pull request title is a Conventional Commit header
        if: github.event_name == 'pull_request'
        # cog reads git's user.name, which a fresh runner doesn't have.
        run: |
          git config --global user.name ci
          printf '%s\n' "$PR_TITLE" | cog verify --file -
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
      - run: mise run check
        env:
          # Lets zizmor run its online audits, such as known-vulnerable actions.
          GH_TOKEN: ${{ github.token }}
