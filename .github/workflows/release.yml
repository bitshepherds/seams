name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Publishes the GitHub release and its assets.
      contents: write
      # Sign each archive's build provenance.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, for the changelog since the last tag.
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # A release never builds from a cache another run could have poisoned.
          cache: false
      - run: mise run check
        env:
          GH_TOKEN: ${{ github.token }}
      - run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Attestations on a private repo need GitHub Enterprise Cloud, so this
      # starts working the day the repo goes public, with nothing else to do.
      - if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
