# The least mise that reads this file as intended, and its lockfile.
min_version = "2026.9.0"

# mise.lock records each tool's checksum and download URL for every platform
# the repo builds on, and CI installs from it, locked.
[settings]
lockfile = true

# The toolchain, pinned: `mise install` installs exactly these versions.
[tools]
actionlint = "1.7.12"
betterleaks = "1.9.0"
cocogitto = "7.0.0"
# The released seams, which sheepdog reads and writes this repo's registry with.
# The gate, and contributors' own edits to the registry, use this checkout's own
# code instead (go run ./cmd/seams), which may be newer. An older seams could
# drop fields it doesn't know, so this moves on after each final release, never
# a pre-release.
"github:bitshepherds/seams" = "1.0.0"
"github:vladopajic/go-test-coverage" = "2.20.0"
go = "1.27.3"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
golangci-lint = "2.15.0"
goreleaser = "2.18.3"
lefthook = "2.2.2"
node = "24.22.0"
"npm:markdownlint-cli2" = "0.23.3"
osv-scanner = "2.7.0"
"pipx:semgrep" = "1.180.0"
"pipx:yamllint" = "1.38.0"
syft = "1.55.0"
uv = "0.13.0"
zizmor = "1.31.1"

# mise install also installs the git hooks.
[hooks]
postinstall = "lefthook install"

[tasks.fast]
description = "The fast tier: what the pre-commit hook runs, in seconds"
run = [
  "golangci-lint fmt --diff",
  "golangci-lint run --fast-only",
  "betterleaks git --pre-commit --staged --no-banner --redact",
]

# The one command that checks the repo: the gate. Each check added later adds itself here.
[tasks.check]
description = "Every check that fits the gate's time budget"
depends = ["fast"]
run = [
  "betterleaks git --no-banner --redact",
  "golangci-lint run",
  "semgrep scan --config p/default --metrics off --error --quiet .",
  "yamllint --strict .",
  "markdownlint-cli2 \"**/*.md\"",
  "actionlint",
  "goreleaser check",
  "zizmor .github/workflows/",
  "govulncheck ./...",
  # Known vulnerabilities, and licences outside the allowed list. testdata/
  # holds detection's fixture repos, whose manifests are read, never installed.
  "osv-scanner scan source --recursive --x-exclude=testdata --licenses=MIT,BSD-2-Clause,BSD-3-Clause,Apache-2.0,ISC .",
  "go test -coverprofile=cover.out ./...",
  "go-test-coverage --config .testcoverage.yml",
  # This repo's own registry, checked by the seams it builds.
  "go run ./cmd/seams validate",
  # This repo's register, docs/SEAMS.md, kept up to date with the registry.
  "go run ./cmd/seams render --check",
]
