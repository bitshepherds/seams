# The toolchain, pinned: `mise install` installs exactly these versions.
[tools]
actionlint = "1.7.12"
betterleaks = "1.9.0"
"github:vladopajic/go-test-coverage" = "2.20.0"
go = "1.27.3"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
golangci-lint = "2.15.0"
lefthook = "2.2.2"
osv-scanner = "2.7.0"
zizmor = "1.31.1"

# mise install also installs the git hooks.
[hooks]
postinstall = "lefthook install"

[tasks.fast]
description = "The fast tier: what the pre-commit hook runs, in seconds"
run = [
  "golangci-lint fmt --diff",
  "golangci-lint run --fast-only",
  "betterleaks git --pre-commit --staged --no-banner --redact",
]

# The one command that checks the repo: the gate. Each check added later adds itself here.
[tasks.check]
description = "Every check that fits the gate's time budget"
depends = ["fast"]
run = [
  "betterleaks git --no-banner --redact",
  "golangci-lint run",
  "actionlint",
  "zizmor .github/workflows/",
  "govulncheck ./...",
  "osv-scanner scan source --recursive .",
  "go test -coverprofile=cover.out ./...",
  "go-test-coverage --config .testcoverage.yml",
]
