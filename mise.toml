# The toolchain, pinned: `mise install` installs exactly these versions.
[tools]
actionlint = "1.7.12"
betterleaks = "1.9.0"
cocogitto = "7.0.0"
"github:vladopajic/go-test-coverage" = "2.20.0"
go = "1.27.3"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
golangci-lint = "2.15.0"
goreleaser = "2.18.3"
lefthook = "2.2.2"
osv-scanner = "2.7.0"
"pipx:semgrep" = "1.180.0"
"pipx:yamllint" = "1.38.0"
syft = "1.55.0"
uv = "0.13.0"
zizmor = "1.31.1"

# mise install also installs the git hooks.
[hooks]
postinstall = "lefthook install"

[tasks.fast]
description = "The fast tier: what the pre-commit hook runs, in seconds"
run = [
  "golangci-lint fmt --diff",
  "golangci-lint run --fast-only",
  "betterleaks git --pre-commit --staged --no-banner --redact",
]

# The one command that checks the repo: the gate. Each check added later adds itself here.
[tasks.check]
description = "Every check that fits the gate's time budget"
depends = ["fast"]
run = [
  "betterleaks git --no-banner --redact",
  "golangci-lint run",
  "semgrep scan --config p/default --metrics off --error --quiet .",
  "yamllint --strict .",
  "actionlint",
  "goreleaser check",
  "zizmor .github/workflows/",
  "govulncheck ./...",
  # Known vulnerabilities, and licences outside the allowed list.
  "osv-scanner scan source --recursive --licenses=MIT,BSD-2-Clause,BSD-3-Clause,Apache-2.0,ISC .",
  "go test -coverprofile=cover.out ./...",
  "go-test-coverage --config .testcoverage.yml",
]
